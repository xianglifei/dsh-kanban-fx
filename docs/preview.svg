<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <defs>
    <pattern id="fxk-dots" width="11" height="11" patternUnits="userSpaceOnUse" x="5.5" y="5.5">
      <circle cx="0.5" cy="0.5" r="0.7" fill="#8a94a6" fill-opacity="0.22"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="640" height="300" fill="url(#fxk-dots)"/>

  <!-- columns -->
  <g fill="#8a94a6" fill-opacity="0.07" stroke="#8a94a6" stroke-opacity="0.42" stroke-width="1.2">
    <rect x="48" y="34" width="124" height="232" rx="12"/>
    <rect x="186" y="34" width="124" height="232" rx="12"/>
    <rect x="324" y="34" width="124" height="232" rx="12"/>
    <rect x="462" y="34" width="124" height="232" rx="12"/>
  </g>

  <!-- column headers: state dot + title bar + count pill -->
  <g>
    <circle cx="62" cy="52" r="3" fill="#8a94a6" fill-opacity="0.75"/>
    <rect x="71" y="49" width="52" height="6" rx="3" fill="#8a94a6" fill-opacity="0.55"/>
    <rect x="148" y="46" width="14" height="12" rx="6" fill="#8a94a6" fill-opacity="0.22"/>

    <circle cx="200" cy="52" r="3" fill="#5b8def"/>
    <rect x="209" y="49" width="52" height="6" rx="3" fill="#8a94a6" fill-opacity="0.55"/>
    <rect x="286" y="46" width="14" height="12" rx="6" fill="#5b8def" fill-opacity="0.28"/>

    <circle cx="338" cy="52" r="3" fill="#d69e2e"/>
    <rect x="347" y="49" width="52" height="6" rx="3" fill="#8a94a6" fill-opacity="0.55"/>
    <rect x="424" y="46" width="14" height="12" rx="6" fill="#d69e2e" fill-opacity="0.28"/>

    <circle cx="476" cy="52" r="3" fill="#3fae6a"/>
    <rect x="485" y="49" width="52" height="6" rx="3" fill="#8a94a6" fill-opacity="0.55"/>
    <rect x="562" y="46" width="14" height="12" rx="6" fill="#3fae6a" fill-opacity="0.28"/>
  </g>

  <!-- to do: three cards -->
  <g fill="#8a94a6" fill-opacity="0.13" stroke="#8a94a6" stroke-opacity="0.34" stroke-width="1">
    <rect x="56" y="68" width="108" height="52" rx="9"/>
    <rect x="56" y="126" width="108" height="38" rx="9"/>
    <rect x="56" y="170" width="108" height="46" rx="9"/>
  </g>
  <!-- to do card content: title line + two body lines -->
  <g fill="#8a94a6" fill-opacity="0.5">
    <rect x="64" y="78" width="66" height="5" rx="2.5"/>
    <rect x="64" y="89" width="92" height="4" rx="2" fill-opacity="0.3"/>
    <rect x="64" y="98" width="74" height="4" rx="2" fill-opacity="0.3"/>

    <rect x="64" y="134" width="54" height="5" rx="2.5"/>
    <rect x="64" y="145" width="82" height="4" rx="2" fill-opacity="0.3"/>

    <rect x="64" y="180" width="70" height="5" rx="2.5"/>
    <rect x="64" y="191" width="92" height="4" rx="2" fill-opacity="0.3"/>
    <rect x="64" y="200" width="60" height="4" rx="2" fill-opacity="0.3"/>
  </g>
  <!-- attachment chip hint -->
  <g fill="#8a94a6" fill-opacity="0.2">
    <rect x="64" y="206" width="22" height="7" rx="3.5"/>
  </g>

  <!-- running: one card with timer bar -->
  <g fill="#5b8def" fill-opacity="0.12" stroke="#5b8def" stroke-opacity="0.5" stroke-width="1">
    <rect x="194" y="68" width="108" height="62" rx="9"/>
  </g>
  <g fill="#8a94a6" fill-opacity="0.5">
    <rect x="202" y="78" width="62" height="5" rx="2.5"/>
    <rect x="202" y="89" width="86" height="4" rx="2" fill-opacity="0.3"/>
    <rect x="202" y="98" width="70" height="4" rx="2" fill-opacity="0.3"/>
  </g>
  <g>
    <circle cx="206" cy="116" r="3" fill="#5b8def"/>
    <rect x="214" y="113" width="34" height="6" rx="3" fill="#5b8def" fill-opacity="0.55"/>
  </g>
  <!-- progress shimmer inside running card -->
  <rect x="202" y="126" width="92" height="3" rx="1.5" fill="#8a94a6" fill-opacity="0.16"/>
  <rect x="202" y="126" width="52" height="3" rx="1.5" fill="#5b8def" fill-opacity="0.6"/>

  <!-- review: two cards, one with a done action pill -->
  <g fill="#8a94a6" fill-opacity="0.13" stroke="#8a94a6" stroke-opacity="0.34" stroke-width="1">
    <rect x="332" y="68" width="108" height="54" rx="9"/>
    <rect x="332" y="130" width="108" height="54" rx="9"/>
  </g>
  <g fill="#8a94a6" fill-opacity="0.5">
    <rect x="340" y="78" width="58" height="5" rx="2.5"/>
    <rect x="340" y="89" width="88" height="4" rx="2" fill-opacity="0.3"/>
    <rect x="340" y="98" width="66" height="4" rx="2" fill-opacity="0.3"/>

    <rect x="340" y="140" width="72" height="5" rx="2.5"/>
    <rect x="340" y="151" width="80" height="4" rx="2" fill-opacity="0.3"/>
  </g>
  <g fill="#3fae6a" fill-opacity="0.18" stroke="#3fae6a" stroke-opacity="0.55" stroke-width="1">
    <rect x="392" y="102" width="42" height="14" rx="7"/>
    <rect x="392" y="164" width="42" height="14" rx="7"/>
  </g>
  <g stroke="#3fae6a" stroke-opacity="0.85" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M400 109.5l2.6 2.8 4.6-5"/>
    <path d="M400 171.5l2.6 2.8 4.6-5"/>
  </g>

  <!-- done: two settled cards -->
  <g fill="#8a94a6" fill-opacity="0.09" stroke="#8a94a6" stroke-opacity="0.28" stroke-width="1">
    <rect x="470" y="68" width="108" height="42" rx="9"/>
    <rect x="470" y="118" width="108" height="42" rx="9"/>
  </g>
  <g fill="#8a94a6" fill-opacity="0.38">
    <rect x="478" y="78" width="64" height="5" rx="2.5"/>
    <rect x="478" y="89" width="86" height="4" rx="2" fill-opacity="0.26"/>

    <rect x="478" y="128" width="52" height="5" rx="2.5"/>
    <rect x="478" y="139" width="78" height="4" rx="2" fill-opacity="0.26"/>
  </g>
  <g stroke="#3fae6a" stroke-opacity="0.7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M552 84l2.4 2.6 4.4-4.8"/>
    <path d="M552 134l2.4 2.6 4.4-4.8"/>
  </g>
</svg>
